name: Обновить профиль Charon
on:
  workflow_dispatch:
    inputs:
      packet:
        description: Пакет изменений из панели владельца
        required: true
        type: string
      check_only:
        description: Только проверить, без публикации
        type: boolean
        default: false
permissions: {}
concurrency:
  group: charon-owner-profile
  cancel-in-progress: false
jobs:
  update:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Проверить владельца, подпись, срок, версию и данные
        id: profile
        env:
          PROFILE_PACKET: ${{ inputs.packet }}
          PROFILE_SIGNING_KEY: ${{ secrets.CHARON_OWNER_SIGNING_V1 }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: node scripts/apply-owner-packet.mjs
      - name: Записать только опубликованный профиль
        if: steps.profile.outputs.changed == 'true'
        run: |
          git add -- public/identity.json
          git -c user.name='Charon Publisher' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Обновление профиля владельцем' -- public/identity.json
          git push origin HEAD:main
      - name: Опубликовать подтверждённую версию
        if: steps.profile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
